<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="title desc">
<title id="title">Illustrative cache-weighted token calculation</title>
<desc id="desc">Generated from shared report colors. Illustrative product artwork, not a measurement.</desc>
<rect x="0" y="0" width="1100" height="430" rx="12" fill="#0B0E14"/><text x="44" y="65" fill="#E0A93B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">harnessmeter</text><text x="44" y="119" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="32">Cache writes change the estimate.</text><text x="44" y="160" fill="#A2ADBA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Example only: 1,000 prefix tokens, 10 turns, two 5-minute cache writes.</text><text x="44" y="220" fill="#A2ADBA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Tokens × turns</text><rect x="300" y="200" width="720" height="26" rx="8" fill="#84B5DE"/><text x="940" y="252" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">10,000</text><text x="44" y="302" fill="#A2ADBA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Cache-weighted</text><rect x="300" y="282" width="237.6" height="26" rx="8" fill="#E0A93B"/><text x="568" y="303" fill="#E6EDF3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">3,300 effective input tokens</text><text x="44" y="365" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">1,000 × (2 × 1.25 + 8 × 0.1) = 3,300</text><text x="44" y="407" fill="#A2ADBA" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">Not a saving guarantee or a subscription bill. Results depend on observed writes and TTL.</text>
</svg>
