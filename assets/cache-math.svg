<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Naive token-turn arithmetic overstates an always-on block by about five times; the write-once model understates it">
  <rect width="900" height="400" rx="10" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="none" stroke="#1C232E"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="32" y="46" font-size="13" fill="#E0A93B" letter-spacing="1.4">A 3,400-TOKEN CLAUDE.md OVER A 34-TURN SESSION</text>

    <!-- naive -->
    <text x="32" y="92" font-size="14" fill="#A8503F">tokens × turns</text>
    <text x="32" y="116" font-size="13" fill="#5A636E">3,400 × 34 turns</text>
    <rect x="300" y="76" width="568" height="30" rx="4" fill="#A8503F" opacity="0.85"/>
    <text x="856" y="97" font-size="14" fill="#0B0E14" text-anchor="end" font-weight="bold">115,600 tokens</text>

    <!-- write-once -->
    <text x="32" y="176" font-size="14" fill="#E0A93B">written once</text>
    <text x="32" y="200" font-size="13" fill="#5A636E">3,400 × 1.25 write</text>
    <text x="32" y="220" font-size="13" fill="#5A636E">+ 3,400 × 33 × 0.1 read</text>
    <rect x="300" y="160" width="76" height="30" rx="4" fill="#E0A93B" opacity="0.85"/>
    <text x="392" y="181" font-size="14" fill="#E0A93B">15,470 tokens</text>

    <!-- measured -->
    <text x="32" y="264" font-size="14" fill="#4E9A6B">harnessmeter</text>
    <text x="32" y="288" font-size="13" fill="#5A636E">3,400 × 2.0 × 2 writes</text>
    <text x="32" y="308" font-size="13" fill="#5A636E">+ 3,400 × 32 × 0.1 read</text>
    <rect x="300" y="248" width="120" height="30" rx="4" fill="#4E9A6B"/>
    <text x="436" y="269" font-size="14" fill="#4E9A6B">24,480 tokens</text>

    <line x1="32" y1="332" x2="868" y2="332" stroke="#1C232E"/>

    <text x="32" y="362" font-size="15" fill="#E6EDF3">Everyone overstates by ~5×. The obvious fix understates by ~1.6×:</text>
    <text x="32" y="384" font-size="15" fill="#E6EDF3">a prefix is not written once. harnessmeter counts the writes.</text>
  </g>
</svg>
