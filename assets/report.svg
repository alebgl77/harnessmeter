<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" role="img" aria-label="Example harnessmeter terminal report">
  <rect width="900" height="690" rx="10" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="899" height="689" rx="10" fill="none" stroke="#1C232E"/>

  <!-- window chrome -->
  <circle cx="26" cy="24" r="5.5" fill="#3A424D"/>
  <circle cx="46" cy="24" r="5.5" fill="#3A424D"/>
  <circle cx="66" cy="24" r="5.5" fill="#3A424D"/>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#161B23"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="26" y="82"  fill="#4E9A6B">$ <tspan fill="#E6EDF3">npx harnessmeter</tspan></text>

    <text x="26" y="118" fill="#5A636E">harnessmeter 0.1.0 · 1,240 sessions · 41,882 turns · 18 days</text>
    <text x="26" y="138" fill="#454D57">illustrative output — not a real measurement</text>

    <text x="26" y="180" fill="#E0A93B" letter-spacing="1.4">CONTEXT PRICE</text>
    <text x="180" y="180" fill="#454D57" font-size="11">cache-weighted effective tokens per session</text>

    <text x="26" y="210" fill="#8B949E">mcp tool schemas   18,200  always-on   <tspan fill="#E6EDF3">82,810 eff</tspan></text>
    <text x="560" y="210" fill="#A8503F">████████████████</text>
    <text x="850" y="210" fill="#8B949E" text-anchor="end">80%</text>

    <text x="26" y="234" fill="#8B949E">CLAUDE.md           3,400  always-on   <tspan fill="#E6EDF3">15,470 eff</tspan></text>
    <text x="560" y="234" fill="#B8873B">███</text>
    <text x="850" y="234" fill="#8B949E" text-anchor="end">15%</text>

    <text x="26" y="258" fill="#8B949E">skills (5)          9,100  on-demand    <tspan fill="#E6EDF3">2,740 eff</tspan></text>
    <text x="560" y="258" fill="#4E9A6B">▌</text>
    <text x="850" y="258" fill="#8B949E" text-anchor="end">3%</text>

    <text x="26" y="282" fill="#8B949E">hooks + settings      310  always-on    <tspan fill="#E6EDF3">1,410 eff</tspan></text>
    <text x="560" y="282" fill="#4E9A6B">▏</text>
    <text x="850" y="282" fill="#8B949E" text-anchor="end">1%</text>

    <text x="26" y="306" fill="#8B949E">subagents (4)       2,050  on-demand      <tspan fill="#E6EDF3">610 eff</tspan></text>
    <text x="560" y="306" fill="#4E9A6B">▏</text>
    <text x="850" y="306" fill="#8B949E" text-anchor="end">1%</text>

    <text x="26" y="352" fill="#E0A93B" letter-spacing="1.4">DEAD SHARE</text>

    <text x="26" y="382" fill="#E6EDF3" font-size="15">71% of your always-on context showed no observable</text>
    <text x="26" y="404" fill="#E6EDF3" font-size="15">consequence across 1,240 sessions.</text>

    <text x="26" y="436" fill="#8B949E">47 of 61 MCP tools never called          <tspan fill="#A8503F">14,900 tok/turn</tspan></text>
    <text x="26" y="458" fill="#8B949E">9 of 23 CLAUDE.md sections never fired    <tspan fill="#A8503F">1,180 tok/turn</tspan></text>

    <text x="26" y="504" fill="#E0A93B" letter-spacing="1.4">TOP PROPOSAL</text>

    <text x="26" y="534" fill="#E6EDF3">Demote CLAUDE.md §"database migrations" (840 tok, always-on)</text>
    <text x="26" y="556" fill="#4E9A6B">→ skill, loads on 4% of sessions</text>
    <text x="26" y="578" fill="#5A636E">receipt: tier T1 · 1,240 sessions · 0 observable consequences</text>
    <text x="26" y="600" fill="#5A636E">class: workflow (not protected) · confidence: high</text>

    <text x="26" y="640" fill="#E0A93B" letter-spacing="1.4">BALANCE</text>
    <text x="180" y="640" fill="#8B949E">analysis cost <tspan fill="#4E9A6B">0 tokens</tspan> · patch saves <tspan fill="#4E9A6B">3,670 tok/session</tspan></text>
    <text x="26" y="666" fill="#5A636E">→ .harnessmeter/report.html</text>
  </g>
</svg>
