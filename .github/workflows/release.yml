name: release

# Publishes to npm. The only thing that can ever be published is a commit carrying a
# `v*` tag whose version matches package.json — a manual run must name an existing tag,
# it cannot publish whatever happens to be on a branch.
#
# Authentication is OIDC "trusted publishing": GitHub mints a short-lived identity token
# for this exact repository and workflow, and npm verifies it. No NPM_TOKEN exists in this
# repository's secrets, because there is no token to store, rotate, or leak.
#
# Configured on npmjs.com under the package's Settings -> Trusted publisher:
#   provider    GitHub Actions
#   repository  alebgl77/harnessmeter
#   workflow    release.yml
#   environment (left empty, matching the publish job below)
#
# Actions are pinned by commit SHA rather than by tag: a tag can be moved, a SHA cannot.
#
# No `${{ }}` expression appears inside a `run:` block. GitHub substitutes those textually
# before the shell parses the line, so a dispatch input — or a tag name, which may contain
# shell metacharacters — would become executable text. Every such value is passed through
# `env:` and read as a quoted shell variable instead. `test/release-workflow.test.ts`
# asserts this property against this file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to publish, without the leading v (e.g. 0.1.4)'
        required: true
        type: string

permissions:
  contents: read

env:
  NPM_VERSION: '12.0.2'

jobs:
  verify:
    name: verify and build the artifact
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: resolve the ref to publish
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"

            # Character guard first, and it must come first: `grep` matches line by line, so
            # a value like "0.1.3<newline>anything" passes a semver grep on its first line
            # and then writes a second line into GITHUB_OUTPUT. `case` sees the whole
            # string, newline included.
            case "$version" in
              '' | *[!0-9A-Za-z.+-]*)
                echo "version contains characters outside [0-9A-Za-z.+-] or is empty"
                exit 1
                ;;
            esac

            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
              echo "invalid semantic version: $version"
              exit 1
            fi
            ref="refs/tags/v$version"
          else
            ref="$PUSH_REF"
          fi

          case "$ref" in
            refs/tags/v*) ;;
            *) echo "refusing to publish from '$ref' — only refs/tags/v* may be published"; exit 1 ;;
          esac

          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'publishing %s\n' "$ref"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 0

      - name: the checked-out commit must be the tag
        env:
          RELEASE_REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          tag="${RELEASE_REF#refs/tags/}"

          if ! git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            echo "tag $tag does not exist"; exit 1
          fi

          tag_sha=$(git rev-parse "refs/tags/$tag^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [ "$tag_sha" != "$head_sha" ]; then
            echo "checked-out commit $head_sha is not tag $tag ($tag_sha)"; exit 1
          fi
          printf 'tag %s -> %s\n' "$tag" "$head_sha"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: pin npm
        env:
          PIN: ${{ env.NPM_VERSION }}
        run: npm install -g "npm@$PIN"

      - name: install from the lockfile
        run: npm ci

      - name: the lockfile must be in sync
        run: git diff --exit-code -- package-lock.json

      - name: tests
        run: npm test

      - name: typecheck
        run: npm run typecheck

      - name: tag must match package.json
        env:
          RELEASE_REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          tag="${RELEASE_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg"; exit 1
          fi
          printf 'version %s\n' "$pkg"

      - name: build the tarball
        run: |
          set -euo pipefail
          npm pack
          mv harnessmeter-*.tgz harnessmeter.tgz

      - name: the tarball must ship no TypeScript
        run: |
          set -euo pipefail
          if tar -tzf harnessmeter.tgz | grep -q '\.ts$'; then
            echo "tarball contains .ts files — they cannot run under node_modules"
            tar -tzf harnessmeter.tgz | grep '\.ts$'
            exit 1
          fi
          echo "tarball is compiled JavaScript only"

      - name: the tarball must install and run
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/harnessmeter.tgz"
          ./node_modules/.bin/harnessmeter --help

      # The digest makes "the published artifact is the verified artifact" checkable rather
      # than merely intended.
      - name: hash the verified tarball
        run: sha256sum harnessmeter.tgz | tee harnessmeter.tgz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: |
            harnessmeter.tgz
            harnessmeter.tgz.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # No `environment:` here. Declaring one rewrites the OIDC subject claim from
    # `repo:OWNER/REPO:ref:refs/tags/vX` to `repo:OWNER/REPO:environment:NAME`, which must
    # then match the Environment field on npmjs.com. Change both together or neither.
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      # No `registry-url` on setup-node: it writes an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, which resolves to an empty token when no such
      # secret exists and takes precedence over the OIDC exchange.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: pin npm
        env:
          PIN: ${{ env.NPM_VERSION }}
        run: npm install -g "npm@$PIN"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball

      - name: the tarball must be the one that was verified
        run: |
          set -euo pipefail
          sha256sum --check harnessmeter.tgz.sha256

      - name: no credentials must be present — OIDC has to be the only path
        run: |
          set -euo pipefail
          rm -f .npmrc ~/.npmrc
          printf 'npm %s\n' "$(npm --version)"

      # Publishing the tarball built and verified above, not a fresh build.
      - name: publish
        run: npm publish harnessmeter.tgz --access public --provenance
